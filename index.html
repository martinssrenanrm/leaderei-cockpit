<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit Leaderei</title>
<meta name="description" content="Cockpit da consultoria Leaderei — a conversa com a IA no centro, dados ao vivo por projeto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--surface:#0f0f0f;--surface2:#171717;--surface3:#222;
  --border:#2a2a2a;--bstrong:#4a4a4a;
  --text:#fff;--t2:#b0b0b0;--muted:#727272;
  --accent:#df4e01;--accent-soft:rgba(223,78,1,.12);--accent-line:rgba(223,78,1,.45);
  --ok:#6fb98a;--ok-soft:rgba(111,185,138,.12);
  --warn:#d6a64a;--warn-soft:rgba(214,166,74,.12);
  --info:#8fa7c9;--info-soft:rgba(143,167,201,.12);
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#fff;--surface:#faf9f7;--surface2:#f3f1ed;--surface3:#e9e6e0;
  --border:#e5e2db;--bstrong:#c7c3ba;
  --text:#17130d;--t2:#5a544a;--muted:#908a7f;
  --accent:#df4e01;--accent-soft:rgba(223,78,1,.08);--accent-line:rgba(223,78,1,.32);
  --ok:#2f8f5b;--ok-soft:rgba(47,143,91,.1);
  --warn:#9c7016;--warn-soft:rgba(156,112,22,.1);
  --info:#45628c;--info-soft:rgba(69,98,140,.1);
  color-scheme:light;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
a{color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-weight:700;font-size:clamp(27px,3.1vw,40px);line-height:1.06;letter-spacing:-.025em}
h2{font-weight:600;font-size:clamp(19px,1.8vw,23px);line-height:1.2;letter-spacing:-.015em}
h3{font-weight:600;font-size:17px;line-height:1.3;letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== shell ===== */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:hidden;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}
.side-top{padding:18px 18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.side-top .brand svg{height:19px;width:auto;display:block;color:var(--text)}
.side-scroll{flex:1;overflow:auto;padding:8px 0}
.navg{border-bottom:1px solid var(--border);padding:8px 0}
.navg.solo{padding:10px 0}
.navg-h{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 18px 8px}
.navg ul{list-style:none;margin:0;padding:0}
.navl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 18px;border-left:2px solid transparent;color:var(--t2);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer}
.navl:hover{color:var(--text)}
.navl.on{color:var(--text);border-left-color:var(--accent);background:var(--surface2)}
.navl .b{font-family:var(--mono);font-size:10px;color:#fff;background:var(--accent);border-radius:2px;padding:1px 6px;font-weight:600}
.subnav{list-style:none;margin:2px 0 6px;padding:0}
.subl{display:block;padding:7px 18px 7px 30px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;font-size:13.5px;cursor:pointer}
.subl:hover{color:var(--text)}
.subl.on{color:var(--text);border-left-color:var(--accent);background:var(--accent-soft)}
.side-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.side-foot .who{font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .lnk{color:var(--t2);cursor:pointer;text-decoration:none;font-size:12px}
.side-foot .lnk:hover{color:var(--accent)}
.menu-btn{display:none}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 clamp(16px,3vw,34px);min-height:54px}
.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--text);font-weight:600}
.tright{margin-left:auto;display:flex;align-items:center;gap:10px}
.tbtn{background:transparent;border:1px solid var(--border);color:var(--t2);font:500 12px var(--mono);letter-spacing:.04em;padding:6px 10px;border-radius:2px;cursor:pointer}
.tbtn:hover{border-color:var(--bstrong);color:var(--text)}
.main{padding:clamp(22px,3vw,38px) clamp(16px,3vw,34px) 90px;max-width:1180px}

/* ===== page header ===== */
.ph{padding-bottom:22px;border-bottom:1px solid var(--border);margin-bottom:26px;display:flex;flex-direction:column;gap:10px}
.ph .eyebrow{margin-bottom:-2px}
.ph .lede{font-size:16.5px;color:var(--t2);max-width:72ch}
.ph .ph-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sec{padding-block:26px;border-bottom:1px solid var(--border)}
.sec:first-of-type{padding-top:4px}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.sec-h h2{font-size:19px}
.sub{color:var(--t2);font-size:14.5px;max-width:74ch}
.vazio{color:var(--muted);font-size:14px}
.src{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ===== facts strip ===== */
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--bstrong)}
.facts.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fact{padding:18px 18px 6px 0;display:flex;flex-direction:column;gap:5px;min-width:0}
.fact+.fact{padding-left:18px;border-left:1px solid var(--border)}
.fact .big{font-weight:700;font-size:clamp(28px,3vw,38px);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.fact .big.a{color:var(--accent)}
.fact .lb{color:var(--t2);font-size:13.5px}
.fact .o{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.4}

/* ===== bars ===== */
.bars{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.bar{display:grid;grid-template-columns:90px 1fr 56px;align-items:center;gap:12px;font-size:13.5px}
.bar .bn{color:var(--t2)}
.bar .bb{height:10px;background:var(--surface3);position:relative}
.bar .bf{display:block;height:10px;background:var(--bstrong)}
.bar .bf.hot{background:var(--accent)}
.bar .bv{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar .bo{grid-column:2/4;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:-6px}
.functrl{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.functrl label{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.functrl select{font:inherit;font-size:13px;color:var(--text);background:var(--surface3);border:1px solid var(--bstrong);border-radius:2px;padding:7px 9px;text-transform:none;letter-spacing:0}
.funrates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.frate{border:1px solid var(--bstrong);border-left:3px solid var(--accent);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.frate .v{font-weight:700;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.frate .k{color:var(--t2);font-size:12.5px}
.ftopo{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:14px}
.funnel{display:flex;flex-direction:column;gap:12px}
.fstep{display:grid;grid-template-columns:160px 1fr 128px;align-items:center;gap:14px}
.fstep .fsl{display:flex;flex-direction:column;gap:2px;min-width:0}
.fstep .fsn{font-weight:600;font-size:14px}
.fstep .fconv{font-family:var(--mono);font-size:10px;color:var(--muted)}
.fstep .fsbar{height:22px;background:var(--surface3);position:relative}
.fstep .fsf{display:block;height:22px;background:var(--accent)}
.fstep .fsv{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}
@media(max-width:560px){.funrates{grid-template-columns:1fr}.fstep{grid-template-columns:104px 1fr 72px;gap:10px}.fstep .fsv{font-size:12.5px}}

/* ===== table ===== */
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--bstrong);margin-top:4px}
table.tbl{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}
table.tbl th{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px 10px 0;border-bottom:1px solid var(--border)}
table.tbl td{padding:11px 14px 11px 0;border-bottom:1px solid var(--border);color:var(--t2);font-variant-numeric:tabular-nums}
table.tbl td:first-child{color:var(--text);font-weight:600}

/* ===== chips / status rows ===== */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--bstrong);color:var(--t2);border-radius:2px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.alta{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.chip.media{color:var(--warn);border-color:rgba(214,166,74,.4);background:var(--warn-soft)}
.chip.ok{color:var(--ok);border-color:rgba(111,185,138,.4);background:var(--ok-soft)}
.chip.on{color:var(--ok);border-color:rgba(111,185,138,.4)}
.chip.info{color:var(--info);border-color:rgba(143,167,201,.4);background:var(--info-soft)}

/* avisos como linhas em filete */
.avlist{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.av{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding:12px 2px;border-bottom:1px solid var(--border);align-items:start;font-size:14px}
.av .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
.av.u3 .dot{background:var(--accent)}.av.u2 .dot{background:var(--warn)}.av.u1 .dot{background:var(--bstrong)}
.av .tx{color:var(--t2)}.av.u3 .tx{color:var(--text)}

/* lista de projetos (geral) em filete */
.pjrows{display:flex;flex-direction:column;border-top:1px solid var(--bstrong)}
.pjrow{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr);gap:18px;align-items:center;padding:16px 2px;border-bottom:1px solid var(--border);cursor:pointer;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;font-family:inherit;color:inherit}
.pjrow:hover{background:var(--surface)}
.pjrow .nm{font-weight:600;font-size:16px}
.pjrow .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start}
.pjrow .mini{display:flex;gap:16px;justify-content:flex-end;flex-wrap:wrap}
.pjrow .mini .mi{display:flex;flex-direction:column;gap:1px;min-width:0}
.pjrow .mini .mi .v{font-family:var(--mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.pjrow .mini .mi .v.a{color:var(--accent)}
.pjrow .mini .mi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ===== prose (markdown do dossiê, sem caixa) ===== */
.prose{font-size:15px;line-height:1.7;max-width:76ch}
.prose h1,.prose h2,.prose h3{font-size:16px;margin:18px 0 8px;color:var(--text);font-weight:700}
.prose h1:first-child,.prose h2:first-child,.prose h3:first-child,.prose p:first-child,.prose ul:first-child{margin-top:0}
.prose p{margin:9px 0;color:var(--t2)}
.prose ul,.prose ol{padding-left:4px;margin:9px 0;list-style:none}
.prose ul li{padding-left:16px;position:relative;color:var(--t2);margin:6px 0}
.prose ul li::before{content:"";position:absolute;left:0;top:.72em;width:7px;height:1px;background:var(--accent)}
.prose ol{counter-reset:n;padding-left:0}
.prose ol li{counter-increment:n;padding-left:26px;position:relative;color:var(--t2);margin:7px 0}
.prose ol li::before{content:counter(n);position:absolute;left:0;top:0;font-family:var(--mono);font-size:12px;color:var(--accent)}
.prose strong{color:var(--text);font-weight:600}
.prose em{color:var(--t2)}
.prose blockquote{margin:12px 0;padding:4px 0 4px 16px;border-left:2px solid var(--accent);color:var(--text);font-size:16px}
.prose blockquote p{color:var(--text)}
.prose table{border-collapse:collapse;width:100%;font-size:13.5px;margin:12px 0}
.prose th,.prose td{border-bottom:1px solid var(--border);padding:8px 10px 8px 0;text-align:left}
.prose th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.prose hr{border:0;border-top:1px solid var(--border);margin:18px 0}

/* destaque "agora" (próxima reunião) */
.now-block{border-top:2px solid var(--accent);padding-top:16px;margin-top:4px}
.now-block .nk{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}

/* ===== sub-tabs (playbook) ===== */
.subtabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:24px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:0 0 auto;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--t2);font:500 14px var(--sans);padding:10px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.subtab:hover{color:var(--text)}
.subtab.on{color:var(--text);border-bottom-color:var(--accent)}

/* ===== geradores (abordagem) ===== */
.gens{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--bstrong)}
.gen{padding:20px 22px 20px 0;display:flex;flex-direction:column;gap:11px;min-width:0}
.gen+.gen{padding-left:22px;border-left:1px solid var(--border)}
.gen .tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
.gen h3{font-size:18px}
.gen p{color:var(--t2);font-size:14px;line-height:1.55;flex:1}

/* ===== ações (demandas) ===== */
.acoes{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.acao{padding:16px 2px;border-bottom:1px solid var(--border)}
.acao-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.acao-t{font-weight:600;font-size:15px}
.acao-pj{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.acao.aprovada .acao-pj{color:var(--ok)}
.acao-d{font-size:14px;color:var(--t2);margin-top:6px;max-width:80ch}
.acao-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ab{font:500 13px var(--sans);padding:6px 12px;border:1px solid var(--bstrong);background:transparent;color:var(--text);cursor:pointer;border-radius:2px}
.ab:hover{border-color:var(--text)}
.ab.ap{border-color:var(--accent);color:var(--accent)}.ab.ap:hover{background:var(--accent);color:#fff}

/* regras editáveis */
.regras{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--border)}
.regra{padding:13px 34px 13px 0;position:relative;font-size:14px;color:var(--t2);border-bottom:1px solid var(--border);line-height:1.55}
.regra .del{position:absolute;right:2px;top:12px;color:var(--muted);cursor:pointer;font-size:13px}
.regra .del:hover{color:var(--accent)}
.regraform{margin-top:16px}
.regraform textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px;font-size:14px;font-family:inherit;min-height:64px;resize:vertical;border-radius:2px}
.regraform textarea:focus{outline:none;border-color:var(--accent)}

/* docs */
.doclist{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.doclink{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:12px 2px;border-bottom:1px solid var(--border);cursor:pointer;color:var(--text);font-weight:500;font-size:14.5px}
.doclink:hover{color:var(--accent)}
.doclink .dt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--info)}
/* classificar documentos */
.clsbox{display:flex;flex-direction:column;gap:10px;max-width:720px}
.fld2{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit;border-radius:2px}
.fld2:focus{outline:none;border-color:var(--accent)}
.clsta{min-height:120px;resize:vertical;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px;font-size:14px;font-family:inherit;border-radius:2px}
.clsta:focus{outline:none;border-color:var(--accent)}
.clsrow{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.clslbl{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fsel{font:inherit;font-size:13px;color:var(--text);background:var(--surface3);border:1px solid var(--bstrong);border-radius:2px;padding:7px 9px;text-transform:none;letter-spacing:0}
.clsok{border-left:3px solid var(--ok);padding:10px 0 10px 14px;margin-top:4px}
.docitems{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.docitem{text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border);padding:14px 2px;cursor:pointer;width:100%;font-family:inherit;color:inherit;display:flex;flex-direction:column;gap:6px}
.docitem:hover{background:var(--surface)}
.docitem-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.docitem-t{font-weight:600;font-size:15px;color:var(--text)}
.docitem-r{font-size:14px;color:var(--t2);line-height:1.55;max-width:84ch}
.docitem-d{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ===== botões ===== */
.btn{background:var(--accent);color:#fff;border:0;padding:10px 16px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border-radius:2px}
.btn:hover:not(:disabled){background:#b53e01}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--accent-soft)}
.btn.sm{padding:7px 12px;font-size:13px}

/* ===== conversa ===== */
.convnote{font-size:14px;color:var(--t2);max-width:76ch;margin-bottom:16px}
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:420px;border:1px solid var(--border);background:var(--surface);border-radius:2px;max-width:900px}
.chatmsgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.chatempty{color:var(--muted);font-size:14px;margin:auto;text-align:center;max-width:44ch;line-height:1.6}
.msg{max-width:100%;padding:13px 16px;font-size:15px;line-height:1.62;border-radius:8px}
.msg.eu{align-self:stretch;background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.msg.ia{align-self:stretch;background:transparent;color:var(--text);padding-left:2px;padding-right:2px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:center}
.sug{background:var(--surface2);border:1px solid var(--border);color:var(--t2);font:500 13px var(--sans);padding:8px 13px;border-radius:999px;cursor:pointer}
.sug:hover{border-color:var(--accent);color:var(--text)}
.msg.ia h1,.msg.ia h2,.msg.ia h3{font-size:15px;margin:6px 0;color:var(--accent)}

.chatinput{display:flex;gap:10px;padding:12px;border-top:1px solid var(--border)}
.chatinput textarea{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px;font-size:14.5px;font-family:inherit;resize:none;height:58px;border-radius:2px}
.chatinput textarea:focus{outline:none;border-color:var(--accent)}

/* ===== overlay documento ===== */
.docov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:60;padding:28px 16px}
.docovbox{background:var(--bg);border:1px solid var(--border);max-width:820px;width:100%;padding:26px;border-radius:2px}
.voltar{font-size:12px;color:var(--t2);cursor:pointer;font-family:var(--mono)}.voltar:hover{color:var(--accent)}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loginbox{width:100%;max-width:360px}.loginbox svg{height:24px;margin-bottom:26px;color:#fff}
.loginbox h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}.loginbox p{color:var(--t2);font-size:14px;margin:0 0 20px}
.fld{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 13px;font-size:15px;font-family:inherit;margin-bottom:10px;border-radius:2px}.fld:focus{outline:none;border-color:var(--accent)}
.logintoggle{margin-top:14px;font-size:13px;color:var(--t2)}.logintoggle a{color:var(--accent);cursor:pointer;text-decoration:underline}
.msgl{font-size:12.5px;color:var(--t2);margin-top:12px;min-height:18px}
.loginbox .btn{width:100%;padding:12px}

  .side-top{border-bottom:0}

  .side.open .side-scroll{display:block;max-height:70vh}

  .pjrow .mini{justify-content:flex-start}
  .gens{grid-template-columns:1fr}

}

<style>
:root{
  --bg:#070708;--surface:#101014;--surface2:#16161c;--surface3:#1e1e26;
  --border:#232330;--bstrong:#3a3a48;
  --text:#f4f4f7;--t2:#b4b4c2;--muted:#71717f;
  --accent:#ff5a16;--accent2:#ff8a3d;--accent-soft:rgba(255,90,22,.13);--accent-line:rgba(255,90,22,.4);
  --glow:rgba(255,90,22,.28);--glow2:rgba(255,138,61,.18);
  --card:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  --cardb:rgba(255,255,255,.08);
  --r:14px;--r2:10px;
  --ok:#5ec98a;--ok-soft:rgba(94,201,138,.12);
  --warn:#e6b250;--warn-soft:rgba(230,178,80,.12);
  --info:#8fb3e6;--info-soft:rgba(143,179,230,.12);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f5f4;--surface:#ffffff;--surface2:#f4f2ef;--surface3:#eceae6;
  --border:#e4e1db;--bstrong:#cfcbc3;
  --text:#14110c;--t2:#56514a;--muted:#8d877d;
  --accent:#e24a01;--accent2:#ff7a2e;--accent-soft:rgba(226,74,1,.08);--accent-line:rgba(226,74,1,.3);
  --glow:rgba(226,74,1,.16);--glow2:rgba(226,74,1,.08);
  --card:linear-gradient(180deg,rgba(0,0,0,.015),rgba(0,0,0,.004));
  --cardb:rgba(0,0,0,.08);
  color-scheme:light;
}
*{transition:border-color .18s ease,background-color .18s ease,color .18s ease,box-shadow .22s ease,transform .18s ease}
body{position:relative;font-size:15.5px;letter-spacing:-.003em}
/* ambiente: glow + grade sutil */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(900px 540px at 82% -8%,var(--glow),transparent 60%),
    radial-gradient(700px 500px at -6% 8%,var(--glow2),transparent 55%);}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask-image:radial-gradient(circle at 70% 0%,#000,transparent 70%);mask-image:radial-gradient(circle at 70% 0%,#000,transparent 70%);}
:root[data-theme="light"] body::after{opacity:.6}

h1{letter-spacing:-.035em;font-weight:800}
.eyebrow,.navg-h,.src,.fconv,.ftopo{text-transform:uppercase}

.navl.on{background:var(--accent-soft);border-left:2px solid transparent;box-shadow:inset 0 0 0 1px var(--accent-line),0 0 24px -8px var(--glow)}

/* botões */

/* números-herói com gradiente */
.fact .big.a,.frate .v,.vg-n.hot{background:linear-gradient(135deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}

/* facts como painel */
.facts,.facts.n3{border-top:0;gap:0;background:var(--card);border:1px solid var(--cardb);border-radius:var(--r);overflow:hidden;box-shadow:0 20px 50px -30px rgba(0,0,0,.7)}

.chip{border-radius:999px;padding:4px 11px;font-weight:600}
.chip.alta{box-shadow:0 0 18px -8px var(--glow)}

/* avisos */
.avlist{border-top:0;gap:2px}
.av{border-bottom:1px solid var(--border);border-radius:10px;padding:12px 12px}
.av.u3{background:var(--accent-soft)}
.av.u3 .dot{box-shadow:0 0 12px 1px var(--glow)}

/* funil / taxas / barras */
.frate{border:1px solid var(--cardb);border-left:2px solid transparent;background:var(--card);border-radius:var(--r2);padding:16px 18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
.frate .v{font-size:28px}
.bar .bb,.fstep .fsbar{border-radius:999px;background:var(--surface3);overflow:hidden}
.bar .bf,.fstep .fsf{border-radius:999px}
.bar .bf.hot,.fstep .fsf{background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 16px -4px var(--glow)}
.functrl select,.fsel,.fld2,.clsta{border-radius:10px;background:var(--surface2)}
.functrl select:focus,.fsel:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}

/* geradores / ações / docs em card */
.gens{border-top:0}
.gen{background:var(--card);border:1px solid var(--cardb);border-radius:var(--r);padding:22px!important;box-shadow:0 14px 40px -32px rgba(0,0,0,.8)}
.gen+.gen{border-left:0;margin-left:0}
.gens{gap:14px;display:grid}
.gen .tag{color:var(--accent2)}
.acao{border-bottom:1px solid var(--border);border-radius:12px;padding:16px}
.acao:hover{background:var(--surface)}
.acao.aprovada{background:var(--ok-soft)}
.docitem{border-radius:12px;padding:16px!important;border-bottom:1px solid var(--border)}
.docitem:hover{background:var(--surface);box-shadow:0 0 0 1px var(--accent-line)}
.doclink{border-radius:10px;padding:12px}.doclink:hover{background:var(--surface);color:var(--accent2)}

/* inputs & chat */
.fld,.chatinput textarea,.regraform textarea{border-radius:12px;background:var(--surface2)}
.fld:focus,.chatinput textarea:focus,.regraform textarea:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.chat{border:1px solid var(--cardb);border-radius:var(--r);background:var(--card);box-shadow:0 24px 60px -36px rgba(0,0,0,.8)}
.msg.eu{border-radius:14px 14px 4px 14px;background:var(--surface2);border:1px solid var(--border)}
.msg.ia h1,.msg.ia h2,.msg.ia h3{color:var(--accent2)}
.loginbox{background:var(--card);border:1px solid var(--cardb);border-radius:20px;padding:34px;box-shadow:0 40px 90px -50px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.02)}
.loginbox svg{filter:drop-shadow(0 0 14px var(--glow))}
.now-block{border-top:2px solid transparent;background:var(--accent-soft);border-radius:var(--r2);padding:18px;box-shadow:inset 0 0 0 1px var(--accent-line)}
.now-block .nk{color:var(--accent2)}
.prose blockquote{border-left:2px solid var(--accent)}
.subtab.on{border-bottom-color:var(--accent)}

/* ===== Vigia de higiene ===== */
.vg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.vg-card{background:var(--card);border:1px solid var(--cardb);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 40px -32px rgba(0,0,0,.8)}
.vg-card.hot{box-shadow:0 14px 40px -30px rgba(0,0,0,.8),inset 0 0 0 1px var(--accent-line),0 0 40px -22px var(--glow)}
.vg-card.warn{box-shadow:0 14px 40px -30px rgba(0,0,0,.8),inset 0 0 0 1px rgba(230,178,80,.35)}
.vg-top{display:flex;align-items:baseline;gap:10px}
.vg-n{font-weight:800;font-size:30px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.vg-k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t2)}
.vg-d{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.vg-list{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--border);padding-top:10px}
.vg-list li{font-size:12.5px;color:var(--t2);font-variant-numeric:tabular-nums}
.vg-et{font-family:var(--mono);font-size:10px;color:var(--muted)}
@media(max-width:620px){.vg-grid{grid-template-columns:1fr}}
@media(max-width:900px){.side{backdrop-filter:none}.gens{grid-template-columns:1fr}}
</style>

  +'<h2>Cockpit da Consultoria</h2><p>'+(criar?"Primeiro acesso: crie uma senha para o seu e-mail Leaderei.":"Entre com seu e-mail e senha.")+'</p>'
  +'<input id="email" class="fld" type="email" placeholder="voce@leaderei.com.br" autocomplete="email">'
  +'<input id="senha" class="fld" type="password" placeholder="senha" autocomplete="'+(criar?"new-password":"current-password")+'">'
  +'<button id="gobtn" class="btn">'+(criar?"Criar acesso":"Entrar")+'</button>'
  +'<div class="logintoggle">'+(criar?'Já tem senha? <a onclick="setModo(\'entrar\')">Entrar</a>':'Primeiro acesso? <a onclick="setModo(\'criar\')">Criar senha</a>')+'</div><div id="loginmsg" class="msgl"></div>';
  el("gobtn").onclick=criar?criarConta:entrar;}
function setModo(m){modo=m;pintarLogin();}
function showLogin(){el("app").style.display="none";el("login").style.display="flex";pintarLogin();}
async function entrar(){var e=el("email").value.trim(),p=el("senha").value;if(!e||!p){el("loginmsg").textContent="Preencha e-mail e senha.";return;}el("gobtn").disabled=true;el("gobtn").textContent="Entrando...";var r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error){el("loginmsg").textContent="E-mail ou senha incorretos.";el("gobtn").disabled=false;el("gobtn").textContent="Entrar";return;}boot();}
async function criarConta(){var e=el("email").value.trim(),p=el("senha").value;if(!e||p.length<6){el("loginmsg").textContent="Senha de no mínimo 6 caracteres.";return;}el("gobtn").disabled=true;el("gobtn").textContent="Criando...";var r=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:"https://martinssrenanrm.github.io/leaderei-cockpit/"}});if(r.error){el("loginmsg").textContent="Erro: "+r.error.message;el("gobtn").disabled=false;el("gobtn").textContent="Criar acesso";return;}if(r.data&&r.data.session){boot();}else{el("loginmsg").innerHTML="Conta criada! Enviamos um <b>link de confirmação</b> para "+esc(e)+". Abra o e-mail <b>neste navegador</b> e clique no link.";el("gobtn").disabled=false;el("gobtn").textContent="Criar acesso";}}
async function logout(){await sb.auth.signOut();showLogin();}

/* boot / load */
async function boot(){var s=(await sb.auth.getSession()).data.session;if(!s){showLogin();return;}el("login").style.display="none";el("app").style.display="grid";el("navlogo").innerHTML=LOGO;el("whoami").textContent=s.user.email;applyTheme(document.documentElement.getAttribute("data-theme")==="light"?"light":"dark");window.UID=s.user.id;await load();}
async function load(){
  var P=await sb.from("projetos").select("*");
  if(P.error){el("main").innerHTML='<p class="sub">Erro ao ler dados: '+esc(P.error.message)+'</p>';return;}
  var M=await sb.from("metricas_funil").select("*");var R=await sb.from("recomendacoes").select("*");var S=await sb.from("sinais_risco").select("*");var AG=await sb.from("v_alerta_ganho").select("*");var AC=await sb.from("acoes").select("*").in("status",["proposta","aprovada"]);
  var RGL=await sb.from("regras_globais").select("*").eq("ativo",true).order("criado_em");
  DADOS={projetos:P.data||[],metricas:M.data||[],recs:R.data||[],sinais:S.data||[],alertaGanho:AG.data||[],acoes:AC.data||[],regrasGlobais:RGL.data||[]};
  DADOS.recsOpen=DADOS.recs.filter(function(r){return !r.resultado;});DADOS.sinaisA=DADOS.sinais.filter(function(s){return !s.resolvido;});
  render();
}
function projScore(p){var a=DADOS.sinaisA.filter(function(s){return s.projeto_id===p.id&&s.severidade==="alta";}).length;var r=DADOS.recsOpen.filter(function(x){return x.projeto_id===p.id;}).length;var ac=DADOS.acoes.filter(function(x){return x.projeto_id===p.id;}).length;return a*100+r*5+ac;}
function projsOrdenados(){return DADOS.projetos.slice().sort(function(a,b){return projScore(b)-projScore(a);});}

/* navegação (sidebar) */

function setCrumb(){var c=el("crumb");if(!c)return;if(ESTADO.view==="geral"){c.innerHTML='<b>Visão geral</b>';}else{var p=proj();c.innerHTML=esc(p?p.nome:"")+' · <b>'+esc(screenNome(ESTADO.pjview))+'</b>';}}
function navegar(view){ESTADO.view=view;if(view==="geral")ESTADO.pid=null;el("side").classList.remove("open");render();}
async function abrirProjeto(pid){ESTADO.view="projeto";ESTADO.pid=pid;ESTADO.pjview="dashboard";ESTADO.pbsec=null;el("side").classList.remove("open");renderNav();el("main").innerHTML='<p class="sub">Carregando…</p>';await carregarProjeto(pid);render();}
async function carregarProjeto(pid){
  if(CACHE[pid])return;
  var F=await sb.from("v_funil_etapa").select("*").eq("projeto_id",pid);
  var C=await sb.from("v_coorte").select("*").eq("projeto_id",pid);
  var G=await sb.from("v_ganhos").select("*").eq("projeto_id",pid);
  var D=await sb.from("documentos").select("id,titulo,criado_em,tipo,resumo,modelo,origem").eq("projeto_id",pid).order("criado_em",{ascending:false});
  var RG=await sb.from("regras_projeto").select("*").eq("projeto_id",pid).order("criado_em");
  var CV=await sb.from("conversas").select("papel,conteudo").eq("projeto_id",pid).order("criado_em");
  var DS=await sb.from("dossie_secoes").select("*").eq("projeto_id",pid).order("ordem");
  var PL=await sb.from("v_funil_pipelines").select("*").eq("projeto_id",pid);
  CACHE[pid]={funil:F.data||[],coorte:C.data||[],ganhos:G.data||[],docs:D.data||[],regras:RG.data||[],conversa:CV.data||[],dossie:DS.data||[],pipelines:PL.data||[]};
}
function render(){renderNav();setCrumb();if(ESTADO.view==="geral")renderGeral();else renderProjeto();}

function tabRegrasGlobais(){var rs=DADOS.regrasGlobais||[];

async function addRegraGlobal(btn){var ta=el("novaregraglobal");if(!ta)return;var txt=ta.value.trim();if(txt.length<4)return;btn.disabled=true;btn.textContent="Salvando...";var r=await sb.from("regras_globais").insert({regra:txt,criado_por:window.UID});if(r.error){btn.disabled=false;btn.textContent="Adicionar regra global";alert("Erro: "+r.error.message);return;}await load();}
async function delRegraGlobal(span){if(!confirm("Remover esta regra global?"))return;var r=await sb.from("regras_globais").delete().eq("id",span.dataset.id);if(r.error){alert("Erro: "+r.error.message);return;}await load();}
function rowProjeto(p){
  var sP=DADOS.sinaisA.filter(function(s){return s.projeto_id===p.id;}),alta=sP.filter(function(s){return s.severidade==="alta";}),media=sP.filter(function(s){return s.severidade==="media";});
  var acP=DADOS.acoes.filter(function(a){return a.projeto_id===p.id;}),mP=DADOS.metricas.filter(function(m){return m.projeto_id===p.id;});
  var resumo=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("neg")===0;})[0];
  var toques=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("toques")===0&&m.contatos!=null;});
  var ch='';
  if(alta.length)ch+='<span class="chip alta">'+alta.length+' risco'+(alta.length>1?"s":"")+' alto'+(alta.length>1?"s":"")+'</span>';
  if(media.length)ch+='<span class="chip media">'+media.length+' médio'+(media.length>1?"s":"")+'</span>';
  if(acP.length)ch+='<span class="chip info">'+acP.length+' ações</span>';
  if(!alta.length&&!media.length&&!acP.length)ch+='<span class="chip ok">sem pendência</span>';
  var mini='';
  if(resumo){mini+='<div class="mi"><span class="v a">'+fmtInt(resumo.fechamentos)+'</span><span class="k">ganhos</span></div>';mini+='<div class="mi"><span class="v">'+fmtMoney(resumo.valor_fechado)+'</span><span class="k">contratado</span></div>';}
  if(toques.length){var tot=toques.reduce(function(s,m){return s+(m.contatos||0);},0);mini+='<div class="mi"><span class="v">'+fmtInt(tot)+'</span><span class="k">toques 30d</span></div>';}
  if(!mini)mini='<div class="mi"><span class="k">sem métrica ainda</span></div>';
  return '<button class="pjrow" data-pid="'+p.id+'" onclick="abrirProjeto(this.dataset.pid)"><span class="nm">'+esc(p.nome)+'</span><span class="chips">'+ch+'</span><span class="mini">'+mini+'</span></button>';
}
function buildAvisos(recsOpen,sinaisA,metricas,ag,projetos){
  var today=new Date().toISOString().slice(0,10),A=[];
  recsOpen.filter(function(r){return r.checar_em;}).forEach(function(r){var dd=diasAte(r.checar_em,today);if(dd<=7)A.push({u:(dd<0||dd<=2)?3:2,t:(dd<0?"Previsão venceu ("+fmtDM(r.checar_em)+")":"Previsão vence em "+dd+"d")+" — "+nomeP(r.projeto_id)+": "+(r.recomendacao||"").slice(0,80)});});
  sinaisA.filter(function(s){return s.severidade==="alta";}).forEach(function(s){A.push({u:3,t:"Risco alto — "+nomeP(s.projeto_id)+": "+(s.descricao||"").slice(0,100)});});
  projetos.forEach(function(p){var t=metricas.filter(function(m){return m.projeto_id===p.id&&m.periodo&&m.periodo.indexOf("toques")===0&&m.contatos!=null;});if(t.length){var tot=t.reduce(function(s,m){return s+m.contatos;},0),em=t.filter(function(m){return m.canal==="email";}).reduce(function(s,m){return s+m.contatos;},0);if(tot>0&&em/tot>0.11)A.push({u:2,t:p.nome+": e-mail passou de 11% das atividades ("+Math.round(em/tot*100)+"%)"});}});
  A.sort(function(a,b){return b.u-a.u;});
  if(!A.length)return '<p class="vazio">Nada urgente agora.</p>';
  var h='<div class="avlist">';A.slice(0,12).forEach(function(a){h+='<div class="av u'+a.u+'"><span class="dot"></span><span class="tx">'+esc(a.t)+'</span></div>';});return h+'</div>';
}

/* TELA: Dashboard — só números */

  h+='<button class="btn" data-fn="war-room" data-slug="'+esc(p.slug)+'" onclick="gerarDoc(this)">Gerar War Room</button>';
  h+=tabDocs(p,c);
  return h+'</div>';
}
function renderDashboard(p,c){
  var mP=DADOS.metricas.filter(function(m){return m.projeto_id===p.id;});
  var resumo=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("neg")===0;})[0];
  var reun=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("reuni")===0;})[0];
  var toques=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("toques")===0&&m.contatos!=null;});
  var totToq=toques.reduce(function(s,m){return s+(m.contatos||0);},0);
  var h=pageHead(p.nome,"Dashboard","Os números do projeto num olhar.");
  if(!resumo&&!toques.length){h+='<div class="sec"><p class="vazio">Sem métricas sincronizadas ainda. O sync do Pipedrive popula este painel.</p></div>';h+=funilSec(p,c);h+=vigiaSec(p,c);h+=warRoomSec(p,c);return h;}
  h+='<div class="facts">';
  h+='<div class="fact"><div class="big a">'+(resumo?fmtInt(resumo.fechamentos):"—")+'</div><div class="lb">ganhos</div></div>';
  h+='<div class="fact"><div class="big">'+(resumo?fmtMoney(resumo.valor_fechado):"—")+'</div><div class="lb">valor contratado</div></div>';
  h+='<div class="fact"><div class="big">'+(reun?fmtInt(reun.reunioes):"—")+'</div><div class="lb">reuniões · 30d</div>'+(reun&&reun.obs?'<div class="o">'+esc(reun.obs)+'</div>':'')+'</div>';
  h+='<div class="fact"><div class="big">'+fmtInt(totToq)+'</div><div class="lb">toques · 30d</div></div>';
  h+='</div>';
  if(toques.length){var mx=Math.max.apply(null,toques.map(function(t){return t.contatos;}));var ts=toques.slice().sort(function(a,b){return b.contatos-a.contatos;});var hc='';ts.forEach(function(t){var w=Math.max(3,Math.round(t.contatos/mx*100));var hot=(t.canal==="whatsapp"||t.canal==="ligacao")?" hot":"";hc+='<div class="bar"><span class="bn">'+esc(canalNome(t.canal))+'</span><span class="bb"><span class="bf'+hot+'" style="width:'+w+'%"></span></span><span class="bv">'+fmtInt(t.contatos)+'</span>'+(t.obs?'<span class="bo">'+esc(t.obs)+'</span>':'')+'</div>';});h+='<div class="sec"><div class="sec-h"><h2>Toques por canal</h2><span class="src">30 dias</span></div><div class="bars">'+hc+'</div></div>';}
  h+=funilSec(p,c);
  h+=vigiaSec(p,c);
  if((c.coorte||[]).length){var co=c.coorte.slice().sort(function(a,b){return a.mes<b.mes?1:-1;});var ht='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>mês</th><th>entraram</th><th>ganho</th><th>perdido</th></tr></thead><tbody>';co.slice(0,6).forEach(function(x){ht+='<tr><td>'+x.mes+'</td><td>'+x.entraram+'</td><td>'+x.won+'</td><td>'+x.lost+'</td></tr>';});ht+='</tbody></table></div>';h+='<div class="sec"><div class="sec-h"><h2>Coorte</h2><span class="src">entrada → resultado</span></div>'+ht+'</div>';}
  h+=warRoomSec(p,c);
  return h;
}

/* ---- Funil (RPC funil_cockpit) ---- */
function projById(id){return (DADOS.projetos||[]).filter(function(x){return x.id===id;})[0];}
function funCfg(pid,c){
  if(!c._funil){
    var pls=(c.pipelines||[]).map(function(x){return x.pipeline;});
    var padrao=pls.indexOf("Vendas")>=0?"Vendas":(pls[0]||"");
    c._funil={pipeline:padrao,periodo:"tudo",base:"criacao"};
  }
  return c._funil;
}
function fopt(v,label,cur){return '<option value="'+v+'"'+(v===cur?' selected':'')+'>'+label+'</option>';}
function funilSec(p,c){
  var pls=c.pipelines||[];
  var h='<div class="sec"><div class="sec-h"><h2>Funil</h2><span class="src">conversão passo a passo</span></div>';
  if(!pls.length){return h+'<p class="vazio">O funil aparece quando o Pipedrive deste cliente estiver conectado.</p></div>';}
  var cfg=funCfg(p.id,c);
  h+='<div class="functrl">';
  h+='<label>Funil<select id="fpipe" onchange="onFunil(\''+p.id+'\')">'+pls.map(function(x){return '<option'+(x.pipeline===cfg.pipeline?' selected':'')+'>'+esc(x.pipeline)+'</option>';}).join('')+'</select></label>';
  h+='<label>Período<select id="fper" onchange="onFunil(\''+p.id+'\')">'+fopt("tudo","Tudo",cfg.periodo)+fopt("30d","Últimos 30 dias",cfg.periodo)+fopt("90d","Últimos 90 dias",cfg.periodo)+fopt("ano","Este ano",cfg.periodo)+fopt("12m","Últimos 12 meses",cfg.periodo)+'</select></label>';
  h+='<label>Base<select id="fbase" onchange="onFunil(\''+p.id+'\')">'+fopt("criacao","Data de criação",cfg.base)+fopt("atividade","Última atividade",cfg.base)+'</select></label>';
  h+='</div><div id="funilbox"><p class="sub">Carregando funil…</p></div></div>';
  return h;
}
function onFunil(pid){
  var c=CACHE[pid];if(!c)return;var cfg=funCfg(pid,c);
  var a=el("fpipe"),b=el("fper"),d=el("fbase");
  if(a)cfg.pipeline=a.value;if(b)cfg.periodo=b.value;if(d)cfg.base=d.value;
  montarFunil(pid);
}
function periodoRange(per){
  if(per==="tudo")return {desde:null,ate:null};
  var hoje=new Date(),ate=hoje.toISOString().slice(0,10),desde;
  if(per==="30d")desde=new Date(hoje.getTime()-30*864e5);
  else if(per==="90d")desde=new Date(hoje.getTime()-90*864e5);
  else if(per==="12m")desde=new Date(hoje.getTime()-365*864e5);
  else if(per==="ano")desde=new Date(hoje.getFullYear(),0,1);
  return {desde:desde.toISOString().slice(0,10),ate:ate};
}
function fpct(a,b){return b>0?(Math.round(a/b*1000)/10).toLocaleString("pt-BR")+"%":"—";}
function funilHTML(j){
  var e=j.etapas||[];if(!e.length)return '<p class="vazio">Sem dados neste filtro.</p>';
  var max=Math.max.apply(null,e.map(function(x){return x.n;}))||1;
  var h='<div class="funrates">'
    +'<div class="frate"><span class="v">'+fpct(e[1].n,e[0].n)+'</span><span class="k">Cadência → Reunião agendada</span></div>'
    +'<div class="frate"><span class="v">'+fpct(e[4].n,e[2].n)+'</span><span class="k">Reuniões realizadas → Venda</span></div>'
    +'</div>';
  h+='<div class="ftopo">Base: '+fmtInt(j.topo)+' no topo (Novo/Pesquisa), fora da conversão · '+fmtInt(j.total)+' no total do funil.</div>';
  h+='<div class="funnel">';
  e.forEach(function(st,i){
    var w=Math.max(4,Math.round(st.n/max*100));
    var conv=i>0?'<span class="fconv">'+fpct(st.n,e[i-1].n)+' do passo anterior</span>':'<span class="fconv">entrada da conversão</span>';
    var val=(st.chave==="venda"&&st.valor)?' · '+fmtMoney(st.valor):'';
    h+='<div class="fstep"><div class="fsl"><span class="fsn">'+esc(st.rotulo)+'</span>'+conv+'</div><div class="fsbar"><span class="fsf" style="width:'+w+'%"></span></div><div class="fsv">'+fmtInt(st.n)+val+'</div></div>';
  });
  return h+'</div>';
}
async function montarFunil(pid){
  var c=CACHE[pid];if(!c)return;var box=el("funilbox");if(!box)return;
  if(!(c.pipelines||[]).length)return;
  var cfg=funCfg(pid,c),r=periodoRange(cfg.periodo),pj=projById(pid);
  var res=await sb.rpc("funil_cockpit",{p_slug:pj.slug,p_pipeline:cfg.pipeline,p_desde:r.desde,p_ate:r.ate,p_base:cfg.base});

  box.innerHTML=funilHTML(res.data||{});
}

function vgCard(nome,n,desc,piores,tone){
  var pe=(piores||[]).map(function(x){var d=(x.dias!=null)?' · '+x.dias+'d':'';return '<li>'+esc(x.titulo||x.org||'—')+(x.etapa?' <span class="vg-et">'+esc(x.etapa)+'</span>':'')+d+'</li>';}).join('');
  var nh=(tone==="hot"&&n>0)?' hot':'';
  return '<div class="vg-card '+(n>0?tone:'')+'"><div class="vg-top"><span class="vg-n'+nh+'">'+fmtInt(n)+'</span><span class="vg-k">'+esc(nome)+'</span></div><p class="vg-d">'+esc(desc)+'</p>'+(pe?'<ul class="vg-list">'+pe+'</ul>':'')+'</div>';
}
function vigiaHTML(j){
  if(!j||!j.sinais)return '<p class="vazio">Sem funil mapeado para este cliente ainda.</p>';

  var h='<p class="sub" style="margin-bottom:16px">'+fmtInt(ab)+' negócios abertos no funil mapeado · SLA follow-up '+pr.sla_dias+' dias úteis · parado > '+pr.parado_dias+' dias.</p><div class="vg-grid">';
  h+=vgCard("sem próximo passo",s.sem_followup.n,"Deals abertos sem nenhuma atividade futura agendada.",s.sem_followup.piores,"hot");
  h+=vgCard("parados",s.parado.n,"Sem interação há mais de "+pr.parado_dias+" dias.",s.parado.piores,"warn");
  h+=vgCard("proposta sem valor",s.proposta_sem_valor.n,"Em etapa de proposta/orçamento sem R$ — quebra o forecast.",s.proposta_sem_valor.piores,"hot");
  h+=vgCard("sem origem",s.sem_origem.n,"Sem canal/origem — impede medir de onde vem a receita.",[],"warn");
  return h+'</div>';
}

  var h=pageHead(p.nome,"Playbook","Treinamento do time: como se vende aqui, função por função.",action);

/* treinamento (Playbook por função): planner (barato) decide os guias; 1 worker Opus por guia, em paralelo */
async function treinarPlaybook(btn){var slug=btn.dataset.slug,t0=btn.textContent;btn.disabled=true;btn.textContent="Montando guias (~2min)…";
  try{
    var pl=await sb.functions.invoke("treinar-playbook",{body:{projeto:slug,modo:"build"}});
    var perr=(pl.data&&pl.data.error)||(pl.error&&pl.error.message);
    if(perr){alert("Não consegui: "+perr);btn.disabled=false;btn.textContent=t0;return;}
    var plano=(pl.data&&pl.data.plano)||[],reunTxt=(pl.data&&pl.data.reunTxt)||"";
    await Promise.all(plano.map(function(secao){return sb.functions.invoke("treinar-playbook",{body:{projeto:slug,secao:secao,reunTxt:reunTxt}});}));
    delete CACHE[ESTADO.pid];await carregarProjeto(ESTADO.pid);render();return;
  }catch(e){alert("Falha: "+String(e&&e.message||e));}
  btn.disabled=false;btn.textContent=t0;}

function fecharDoc(){el("docov").style.display="none";}
function mostrarDoc(md){el("docovbody").innerHTML=mdRender(md);el("docov").style.display="flex";el("docov").scrollTop=0;}
async function gerarDoc(btn){var slug=btn.dataset.slug,fn=btn.dataset.fn,t0=btn.textContent;btn.disabled=true;btn.textContent="Gerando (~30s)…";try{var r=await sb.functions.invoke(fn,{body:{projeto:slug}});var err=(r.data&&r.data.error)||(r.error&&r.error.message);if(err||!r.data||!r.data.documento){alert("Não consegui gerar: "+(err||"erro"));}else{mostrarDoc(r.data.documento.conteudo);delete CACHE[ESTADO.pid];await carregarProjeto(ESTADO.pid);render();}}catch(e){alert("Falha: "+String(e&&e.message||e));}btn.disabled=false;btn.textContent=t0;}
async function verDoc(span){var r=await sb.from("documentos").select("conteudo").eq("id",span.dataset.id).single();if(r.error){alert("Erro: "+r.error.message);return;}mostrarDoc(r.data.conteudo);}

sb.auth.onAuthStateChange(function(e){if(e==="SIGNED_IN")boot();});
boot();
</script>
