<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit Leaderei</title>
<meta name="description" content="Cockpit da consultoria Leaderei — conversa com a IA no centro, dados ao vivo por projeto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--surface:#131313;--surface2:#1f1f1f;--border:#313131;--bstrong:#606060;--text:#fff;--t2:#a0a0a0;--muted:#606060;--accent:#df4e01;--alta:#df4e01;--media:#c9a227;--ok:#3fae6b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.mono{font-family:'JetBrains Mono',monospace}
.shell{display:flex;min-height:100vh}
.nav{width:238px;flex:none;border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow:auto}
.nav .logo{margin:2px 8px 18px}.nav .logo svg{height:19px;width:auto}
.navitem{display:block;padding:9px 11px;font-size:14px;color:var(--t2);cursor:pointer;border-left:2px solid transparent}
.navitem:hover{color:var(--text)}
.navitem.ativo{color:var(--text);border-left-color:var(--accent);background:var(--surface)}
.navitem .b{float:right;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--alta);margin-top:2px}
.navsec{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px 11px}
.navfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t2);display:flex;flex-direction:column;gap:6px}
.navfoot a{color:var(--t2);text-decoration:underline;cursor:pointer}
.main{flex:1;min-width:0;padding:26px 28px 40px;max-width:1120px}
h1{font-weight:700;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--t2);font-size:14px;max-width:62ch}
.pjhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.voltar{font-size:12px;color:var(--t2);cursor:pointer;font-family:'JetBrains Mono',monospace}.voltar:hover{color:var(--accent)}
.sec{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:26px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.vazio{color:var(--muted);font-size:13.5px;padding:8px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin:20px 0 0}
.kpi{background:var(--surface);padding:16px}
.kpi .v{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:28px}.kpi .v.ac{color:var(--accent)}
.kpi .l{font-size:12px;color:var(--t2);margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--border);padding:18px;cursor:pointer}
.card.alta{border-color:var(--accent)}.card:hover{border-color:var(--bstrong)}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.hd .nm{font-weight:700;font-size:18px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--bstrong);color:var(--t2)}
.badge.alta{border-color:var(--alta);color:var(--alta)}.badge.media{border-color:var(--media);color:var(--media)}.badge.ok{border-color:var(--ok);color:var(--ok)}.badge.on{border-color:var(--accent);color:var(--accent)}
.barswrap{margin:14px 0 4px}.barslbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--t2);margin-bottom:8px}
.bar{display:grid;grid-template-columns:66px 1fr 42px;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.bar .bn{color:var(--t2)}.bar .bb{height:9px;background:var(--surface2)}.bar .bf{display:block;height:9px;background:var(--bstrong)}.bar .bf.hot{background:var(--accent)}.bar .bv{text-align:right;font-family:'JetBrains Mono',monospace}
.funnel{display:flex;border:1px solid var(--border);margin:14px 0 4px}
.funnel .step{flex:1;padding:10px 6px;text-align:center;border-right:1px solid var(--border)}.funnel .step:last-child{border-right:0}
.funnel .step .v{font-weight:600;font-size:16px;font-family:'JetBrains Mono',monospace}.funnel .step.hi .v{color:var(--accent)}.funnel .step .k{font-size:10px;color:var(--t2);margin-top:2px}
.nofunnel{margin:12px 0 4px;padding:10px 12px;border:1px dashed var(--bstrong);color:var(--t2);font-size:12.5px}
.src{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
.tbl th,.tbl td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;white-space:nowrap}
.tbl th{color:var(--t2);font-weight:500}.tbl td:first-child{white-space:normal}
.avisos{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border)}
.aviso{background:var(--surface);padding:10px 13px;font-size:13px;border-left:3px solid var(--muted);color:var(--t2)}
.aviso.u3{border-left-color:var(--alta);color:var(--text)}.aviso.u2{border-left-color:var(--media)}.aviso.u1{border-left-color:var(--bstrong)}
.acoes{display:flex;flex-direction:column;gap:10px}
.acao{background:var(--bg);border:1px solid var(--border);padding:12px}.acao.aprovada{border-left:3px solid var(--accent)}
.acao-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.acao-t{font-weight:600;font-size:13.5px}
.acao-pj{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);white-space:nowrap}
.acao-d{font-size:12.5px;color:var(--t2);margin-top:5px}.acao-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ab{font-size:12px;padding:5px 10px;border:1px solid var(--bstrong);background:transparent;color:var(--text);cursor:pointer;font-family:inherit}
.ab.ap{border-color:var(--accent);color:var(--accent)}.ab:hover{border-color:var(--text)}
.doclist{display:flex;flex-direction:column;gap:6px;margin:4px 0}
.doclink{font-size:12px;color:var(--accent);cursor:pointer;font-family:'JetBrains Mono',monospace}.doclink:hover{text-decoration:underline}
.regra{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--accent);padding:10px 30px 10px 12px;margin-bottom:8px;font-size:12.5px;color:var(--t2);position:relative}
.regra .del{position:absolute;right:8px;top:8px;color:var(--muted);cursor:pointer;font-size:12px}.regra .del:hover{color:var(--alta)}
.regraform textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:9px;font-size:12.5px;font-family:inherit;min-height:60px;resize:vertical}
.regraform textarea:focus{outline:none;border-color:var(--accent)}
/* abas do projeto */
.pjtabs{display:flex;gap:2px;margin-top:14px;border-bottom:1px solid var(--border)}
.pjtab{padding:9px 16px;font-size:13px;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.pjtab:hover{color:var(--text)}.pjtab.ativo{color:var(--text);border-bottom-color:var(--accent)}
/* dossiê — portal do cliente */
.dossie{margin-top:18px}
.dosshead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.dossmeta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
/* banda de prioridade — o que vem agora */
.dsnow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 22px}
.pcard{border:1px solid var(--accent);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.pcard .ph{padding:11px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.pcard .ph .pk{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pcard .ph .pt{font-weight:700;font-size:14px}
.pcard .pb{padding:13px 16px;max-height:340px;overflow:auto}
/* corpo do portal: nav lateral + conteúdo */
.dsp{display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:start}
.dspnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:18px}
.dspnav .dsgrp{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px 11px}
.dspn{padding:10px 11px;font-size:13.5px;color:var(--t2);cursor:pointer;border-left:2px solid transparent}
.dspn:hover{color:var(--text)}
.dspn.on{color:var(--text);border-left-color:var(--accent);background:var(--surface)}
.dspcard{border:1px solid var(--border);background:var(--surface);min-width:0}
.dspcard>.ch{padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--border)}
.dspcard>.cb{padding:18px 20px}
.dsb h1,.dsb h2,.dsb h3{font-size:15px;margin:14px 0 7px;color:var(--text);font-weight:700}
.dsb h1:first-child,.dsb h2:first-child,.dsb h3:first-child,.dsb p:first-child,.dsb ul:first-child{margin-top:0}
.dsb p{margin:8px 0;color:var(--t2);font-size:14px;line-height:1.65}
.dsb ul,.dsb ol{padding-left:20px;margin:8px 0}.dsb li{margin:5px 0;color:var(--t2);font-size:14px;line-height:1.6}
.dsb strong{color:var(--text)}
.dsb blockquote{margin:10px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--bg);color:var(--text);font-size:14px}
.dsb blockquote p{color:var(--text);margin:4px 0}
.dsb table{border-collapse:collapse;width:100%;font-size:12.5px;margin:10px 0}.dsb th,.dsb td{border:1px solid var(--border);padding:6px 9px;text-align:left}.dsb th{color:var(--t2)}
.dsb hr{border:0;border-top:1px solid var(--border);margin:16px 0}
@media(max-width:820px){.dsnow{grid-template-columns:1fr}.dsp{grid-template-columns:1fr}.dspnav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--border);padding-bottom:10px}.dspnav .dsgrp{display:none}.dspn{border-left:0;border:1px solid var(--border);padding:7px 11px}.dspn.on{border-color:var(--accent)}.pcard .pb{max-height:none}}
/* telas do projeto (submenu) */
.scrkick{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.scrtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.scrtop h1{margin:0}
.navsub{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px;padding-left:9px;border-left:1px solid var(--border)}
.navsubitem{padding:7px 11px;font-size:13px;color:var(--t2);cursor:pointer;border-left:2px solid transparent;margin-left:-1px}
.navsubitem:hover{color:var(--text)}
.navsubitem.on{color:var(--text);border-left-color:var(--accent);background:var(--surface)}
/* dashboard */
.dtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin:18px 0}
.dtile{background:var(--surface);padding:15px 16px 14px}
.dtile .v{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:26px;line-height:1.05}.dtile .v.ac{color:var(--accent)}
.dtile .l{font-size:12px;color:var(--t2);margin-top:4px}
.dtile .o{font-size:10.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.dgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start;margin-top:2px}
.dcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{border:1px solid var(--border);background:var(--surface);min-width:0}
.panel>.ph{padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--border)}
.panel>.pb{padding:15px 16px}
/* abordagem */
.gengrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 20px}
.gencard{border:1px solid var(--border);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:11px}
.gencard .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--media)}
.gencard h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.gencard p{margin:0;color:var(--t2);font-size:13.5px;line-height:1.55;flex:1}
/* conversa */
.convwrap{max-width:880px;margin-top:6px}
.stack{display:flex;flex-direction:column;gap:16px;margin-top:6px}
@media(max-width:820px){.dtiles{grid-template-columns:1fr 1fr}.dgrid{grid-template-columns:1fr}.gengrid{grid-template-columns:1fr}}
/* workspace: conversa + trilho */
.pjwork{display:grid;grid-template-columns:1fr 344px;gap:24px;margin-top:18px;align-items:start}
.chat{display:flex;flex-direction:column;height:calc(100vh - 170px);min-height:440px;border:1px solid var(--border);background:var(--surface)}
.chatmsgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chatempty{color:var(--muted);font-size:13.5px;margin:auto;text-align:center;max-width:40ch;line-height:1.6}
.msg{max-width:86%;padding:10px 13px;font-size:14px;line-height:1.55}
.msg.eu{align-self:flex-end;background:var(--accent);color:#fff}
.msg.ia{align-self:flex-start;background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.msg.ia h1,.msg.ia h2,.msg.ia h3{font-size:15px;margin:6px 0;color:var(--accent)}
.msg.ia p{margin:6px 0}.msg.ia ul,.msg.ia ol{padding-left:18px;margin:6px 0}.msg.ia strong{color:#fff}
.chatinput{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
.chatinput textarea{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px;font-size:14px;font-family:inherit;resize:none;height:56px}
.chatinput textarea:focus{outline:none;border-color:var(--accent)}
.chatinput .btn{width:auto;padding:0 18px}
.rail{display:flex;flex-direction:column;gap:12px}
.railbtns{display:flex;flex-direction:column;gap:8px}
.btn{width:100%;background:var(--accent);color:#fff;border:0;padding:11px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}.btn:disabled{opacity:.6;cursor:default}
.accsec{border:1px solid var(--border);background:var(--surface)}
.acch{padding:11px 13px;font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.acch:hover{color:var(--text)}.acch .accx{color:var(--accent);font-size:15px;line-height:1}
.accbody{padding:0 13px 14px}
/* overlay de documento */
.docov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:60;padding:24px 16px}
.docovbox{background:var(--bg);border:1px solid var(--border);max-width:820px;width:100%;padding:22px}
.wrdoc{font-size:14px;line-height:1.6}
.wrdoc h1{font-size:22px;margin:0 0 10px}.wrdoc h2{font-size:16px;margin:20px 0 8px;color:var(--accent);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em}
.wrdoc h3{font-size:14px;margin:14px 0 6px}.wrdoc ul,.wrdoc ol{padding-left:20px;margin:8px 0}.wrdoc li{margin:3px 0;color:var(--t2)}
.wrdoc p{margin:8px 0;color:var(--t2)}.wrdoc strong{color:var(--text)}
.wrdoc table{border-collapse:collapse;width:100%;font-size:12.5px;margin:10px 0}.wrdoc th,.wrdoc td{border:1px solid var(--border);padding:5px 8px;text-align:left}.wrdoc th{color:var(--t2)}
/* login */
.login{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loginbox{width:100%;max-width:360px}.loginbox svg{height:24px;margin-bottom:26px}
.loginbox h2{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}.loginbox p{color:var(--t2);font-size:14px;margin:0 0 20px}
.fld{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 13px;font-size:15px;font-family:inherit;margin-bottom:10px}.fld:focus{outline:none;border-color:var(--accent)}
.toggle{margin-top:14px;font-size:13px;color:var(--t2)}.toggle a{color:var(--accent);cursor:pointer;text-decoration:underline}
.msgl{font-size:12.5px;color:var(--t2);margin-top:12px;min-height:18px}
@media(max-width:820px){.shell{flex-direction:column}.nav{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--border);flex-direction:row;flex-wrap:wrap;align-items:center;gap:2px;padding:12px}.nav .logo{margin:0 10px 0 4px}.nav .navsec{display:none}.nav .navfoot{margin:0 0 0 auto;border:0;padding:0;flex-direction:row;gap:10px}.main{padding:20px 16px 40px}.cards,.kpis{grid-template-columns:1fr}.pjwork{grid-template-columns:1fr}.chat{height:62vh}}
</style>
</head>

<script>

/* login */
function pintarLogin(){var criar=modo==="criar";el("loginbox").innerHTML=LOGO

  el("gobtn").onclick=criar?criarConta:entrar;}

async function entrar(){var e=el("email").value.trim(),p=el("senha").value;if(!e||!p){el("loginmsg").textContent="Preencha e-mail e senha.";return;}el("gobtn").disabled=true;el("gobtn").textContent="Entrando...";var r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error){el("loginmsg").textContent="E-mail ou senha incorretos.";el("gobtn").disabled=false;el("gobtn").textContent="Entrar";return;}boot();}

async function load(){
  var P=await sb.from("projetos").select("*");
  if(P.error){el("main").innerHTML='<p class="sub">Erro ao ler dados: '+esc(P.error.message)+'</p>';return;}
  var M=await sb.from("metricas_funil").select("*");var R=await sb.from("recomendacoes").select("*");var S=await sb.from("sinais_risco").select("*");var AG=await sb.from("v_alerta_ganho").select("*");var AC=await sb.from("acoes").select("*").in("status",["proposta","aprovada"]);
  DADOS={projetos:P.data||[],metricas:M.data||[],recs:R.data||[],sinais:S.data||[],alertaGanho:AG.data||[],acoes:AC.data||[]};
  DADOS.recsOpen=DADOS.recs.filter(function(r){return !r.resultado;});DADOS.sinaisA=DADOS.sinais.filter(function(s){return !s.resolvido;});
  render();
}
function projScore(p){var a=DADOS.sinaisA.filter(function(s){return s.projeto_id===p.id&&s.severidade==="alta";}).length;var r=DADOS.recsOpen.filter(function(x){return x.projeto_id===p.id;}).length;var ac=DADOS.acoes.filter(function(x){return x.projeto_id===p.id;}).length;return a*100+r*5+ac;}
function projsOrdenados(){return DADOS.projetos.slice().sort(function(a,b){return projScore(b)-projScore(a);});}

/* navegação */
var PJSCREENS=[{k:"dashboard",nome:"Dashboard"},{k:"conversa",nome:"Conversa"},{k:"playbook",nome:"Playbook"},{k:"abordagem",nome:"Abordagem"},{k:"demandas",nome:"Demandas"}];
function renderNav(){var h='<div class="navitem'+(ESTADO.view==="geral"?" ativo":"")+'" onclick="navegar(\'geral\')">Visão geral</div><div class="navsec">Projetos</div>';
  projsOrdenados().forEach(function(p){var alta=DADOS.sinaisA.filter(function(s){return s.projeto_id===p.id&&s.severidade==="alta";}).length;var on=ESTADO.view==="projeto"&&ESTADO.pid===p.id;h+='<div class="navitem'+(on?" ativo":"")+'" data-pid="'+p.id+'" onclick="abrirProjeto(this.dataset.pid)">'+esc(p.nome)+(alta?'<span class="b">'+alta+'</span>':'')+'</div>';
    if(on){h+='<div class="navsub">';PJSCREENS.forEach(function(s){h+='<div class="navsubitem'+(ESTADO.pjview===s.k?" on":"")+'" data-k="'+s.k+'" onclick="setPjView(this.dataset.k)">'+s.nome+'</div>';});h+='</div>';}});
  el("navitems").innerHTML=h;}
function navegar(view){ESTADO.view=view;if(view==="geral")ESTADO.pid=null;render();}
async function abrirProjeto(pid){ESTADO.view="projeto";ESTADO.pid=pid;ESTADO.dsec=null;ESTADO.pjview="dashboard";renderNav();el("main").innerHTML='<p class="sub">Carregando…</p>';await carregarProjeto(pid);render();}
async function carregarProjeto(pid){
  if(CACHE[pid])return;
  var F=await sb.from("v_funil_etapa").select("*").eq("projeto_id",pid);
  var C=await sb.from("v_coorte").select("*").eq("projeto_id",pid);
  var G=await sb.from("v_ganhos").select("*").eq("projeto_id",pid);
  var D=await sb.from("documentos").select("id,titulo,criado_em,tipo").eq("projeto_id",pid).order("criado_em",{ascending:false});
  var RG=await sb.from("regras_projeto").select("*").eq("projeto_id",pid).order("criado_em");
  var CV=await sb.from("conversas").select("papel,conteudo").eq("projeto_id",pid).order("criado_em");
  var DS=await sb.from("dossie_secoes").select("*").eq("projeto_id",pid).order("ordem");
  CACHE[pid]={funil:F.data||[],coorte:C.data||[],ganhos:G.data||[],docs:D.data||[],regras:RG.data||[],conversa:CV.data||[],dossie:DS.data||[]};
}
function render(){renderNav();if(ESTADO.view==="geral")renderGeral();else renderProjeto();}

/* visão geral */
function renderGeral(){
  var alta=DADOS.sinaisA.filter(function(s){return s.severidade==="alta";}).length;
  var h='<h1>O que precisa da sua atenção hoje</h1><p class="sub">Todos os projetos num lugar. Clique num projeto pra abrir o workspace dele e conversar com o consultor.</p>';
  h+='<div class="kpis"><div class="kpi"><div class="v">'+DADOS.projetos.length+'</div><div class="l">projetos ativos</div></div><div class="kpi"><div class="v ac">'+DADOS.recsOpen.length+'</div><div class="l">recomendações em aberto</div></div><div class="kpi"><div class="v ac">'+DADOS.sinaisA.length+'</div><div class="l"><b style="color:var(--text)">'+alta+' altos</b> · hoje</div></div></div>';
  h+=buildAvisos(DADOS.recsOpen,DADOS.sinaisA,DADOS.metricas,DADOS.alertaGanho,DADOS.projetos,true);
  h+='<div class="sec">Projetos — ordenados por risco</div><div class="cards">';
  projsOrdenados().forEach(function(p){h+=cardProjeto(p);});
  el("main").innerHTML=h+'</div>';
}
function cardProjeto(p){
  var sP=DADOS.sinaisA.filter(function(s){return s.projeto_id===p.id;}),alta=sP.filter(function(s){return s.severidade==="alta";}),media=sP.filter(function(s){return s.severidade==="media";});
  var acP=DADOS.acoes.filter(function(a){return a.projeto_id===p.id;}),mP=DADOS.metricas.filter(function(m){return m.projeto_id===p.id;});
  var toques=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("toques")===0&&m.contatos!=null;}),resumo=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("neg")===0;})[0];
  var h='<div class="card'+(alta.length?" alta":"")+'" data-pid="'+p.id+'" onclick="abrirProjeto(this.dataset.pid)"><div class="hd"><span class="nm">'+esc(p.nome)+'</span>'+(toques.length?'<span class="badge on">ao vivo</span>':'')+'</div><div class="badges">';
  if(alta.length)h+='<span class="badge alta">'+alta.length+' risco alto'+(alta.length>1?"s":"")+'</span>';
  if(media.length)h+='<span class="badge media">'+media.length+' médio'+(media.length>1?"s":"")+'</span>';
  if(acP.length)h+='<span class="badge">'+acP.length+' ações</span>';
  if(!alta.length&&!media.length&&!acP.length)h+='<span class="badge ok">sem pendência</span>';
  h+='</div>';
  if(toques.length){var max=Math.max.apply(null,toques.map(function(t){return t.contatos;}));toques.sort(function(a,b){return b.contatos-a.contatos;});h+='<div class="barswrap"><div class="barslbl">TOQUES POR CANAL · 30 DIAS</div>';toques.forEach(function(t){var w=Math.max(3,Math.round(t.contatos/max*100));var hot=(t.canal==="whatsapp"||t.canal==="ligacao")?" hot":"";h+='<div class="bar"><span class="bn">'+esc(canalNome(t.canal))+'</span><span class="bb"><span class="bf'+hot+'" style="width:'+w+'%"></span></span><span class="bv">'+fmtInt(t.contatos)+'</span></div>';});h+='</div>';}
  if(resumo)h+='<div class="funnel"><div class="step"><div class="v">'+fmtInt(resumo.contatos)+'</div><div class="k">negócios</div></div><div class="step hi"><div class="v">'+fmtInt(resumo.fechamentos)+'</div><div class="k">ganhos</div></div><div class="step hi"><div class="v">'+fmtMoney(resumo.valor_fechado)+'</div><div class="k">ganho</div></div></div>';
  else if(!toques.length)h+='<div class="nofunnel">Sem métrica de funil ainda.</div>';
  return h+'</div>';
}
function buildAvisos(recsOpen,sinaisA,metricas,ag,projetos,comHeader){
  var today=new Date().toISOString().slice(0,10),A=[];
  recsOpen.filter(function(r){return r.checar_em;}).forEach(function(r){var dd=diasAte(r.checar_em,today);if(dd<=7)A.push({u:(dd<0||dd<=2)?3:2,t:(dd<0?"Previsão venceu ("+fmtDM(r.checar_em)+")":"Previsão vence em "+dd+"d")+" — "+nomeP(r.projeto_id)+": "+(r.recomendacao||"").slice(0,80)});});
  sinaisA.filter(function(s){return s.severidade==="alta";}).forEach(function(s){A.push({u:3,t:"Risco alto — "+nomeP(s.projeto_id)+": "+(s.descricao||"").slice(0,100)});});
  projetos.forEach(function(p){var t=metricas.filter(function(m){return m.projeto_id===p.id&&m.periodo&&m.periodo.indexOf("toques")===0&&m.contatos!=null;});if(t.length){var tot=t.reduce(function(s,m){return s+m.contatos;},0),em=t.filter(function(m){return m.canal==="email";}).reduce(function(s,m){return s+m.contatos;},0);if(tot>0&&em/tot>0.11)A.push({u:2,t:p.nome+": e-mail passou de 11% das atividades ("+Math.round(em/tot*100)+"%)"});}});
  A.sort(function(a,b){return b.u-a.u;});
  var head=comHeader?'<div class="sec">Avisos — o que pede ação</div>':'';
  if(!A.length)return head+'<p class="vazio">Nada urgente agora.</p>';
  var h=head+'<div class="avisos">';A.slice(0,12).forEach(function(a){h+='<div class="aviso u'+a.u+'">'+esc(a.t)+'</div>';});return h+'</div>';
}

/* workspace: conversa + trilho */
function setPjView(v){ESTADO.pjview=v;render();}
function scrHead(p,title,sub,action){
  return '<div class="scrkick"><span class="voltar" onclick="navegar(\'geral\')">← todos os projetos</span></div><div class="scrtop"><h1>'+esc(title)+'</h1>'+(action||'')+'</div>'+(sub?'<p class="sub" style="margin-top:4px">'+sub+'</p>':'');
}
function dsec(c,k){return (c.dossie||[]).filter(function(s){return s.secao===k;})[0];}
function secPanel(s,destaque){return s?('<article class="'+(destaque?"pcard":"panel")+'"><div class="'+(destaque?"ph":"ph")+'">'+(destaque?'<span class="pk">agora</span><span class="pt">'+esc(s.titulo)+'</span>':esc(s.titulo))+'</div><div class="'+(destaque?"pb dsb":"pb dsb")+'">'+mdRender(s.conteudo_md||"")+'</div></article>'):'';}
function dossieBtn(p,txt){return '<button class="btn" style="width:auto;padding:9px 16px" data-slug="'+esc(p.slug)+'" onclick="reconstruirDossie(this)">'+txt+'</button>';}
function dossieVazio(p,oque){return '<div class="panel"><div class="pb"><p class="sub" style="margin:0 0 12px">O consultor ainda não montou o dossiê deste cliente. '+oque+' aparece aqui depois que ele lê as reuniões e a história do projeto.</p>'+dossieBtn(p,"Construir dossiê (Opus)")+'</div></div>';}

function renderProjeto(){
  var p=proj();if(!p){navegar("geral");return;}var c=CACHE[p.id]||{};var v=ESTADO.pjview||"dashboard";
  var body=v==="conversa"?renderConversa(p,c):v==="playbook"?renderPlaybook(p,c):v==="abordagem"?renderAbordagem(p,c):v==="demandas"?renderDemandas(p,c):renderDashboard(p,c);
  el("main").innerHTML=body;if(v==="conversa")renderChat();
}

/* TELA: Dashboard */
function renderDashboard(p,c){
  var mP=DADOS.metricas.filter(function(m){return m.projeto_id===p.id;});
  var resumo=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("neg")===0;})[0];
  var reun=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("reuni")===0;})[0];
  var toques=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("toques")===0&&m.contatos!=null;});
  var totToq=toques.reduce(function(s,m){return s+(m.contatos||0);},0);
  var h=scrHead(p,"Dashboard","Os números do projeto num olhar.");
  if(resumo||toques.length){
    h+='<div class="dtiles">';
    h+='<div class="dtile"><div class="v ac">'+(resumo?fmtInt(resumo.fechamentos):"—")+'</div><div class="l">ganhos</div></div>';
    h+='<div class="dtile"><div class="v">'+(resumo?fmtMoney(resumo.valor_fechado):"—")+'</div><div class="l">valor contratado</div></div>';
    h+='<div class="dtile"><div class="v">'+(reun?fmtInt(reun.reunioes):"—")+'</div><div class="l">reuniões · 30d</div>'+(reun&&reun.obs?'<div class="o">'+esc(reun.obs)+'</div>':'')+'</div>';
    h+='<div class="dtile"><div class="v">'+fmtInt(totToq)+'</div><div class="l">toques · 30d</div></div>';
    h+='</div>';
  }
  h+='<div class="dgrid"><div class="dcol">';
  // canais
  if(toques.length){var mx=Math.max.apply(null,toques.map(function(t){return t.contatos;}));var ts=toques.slice().sort(function(a,b){return b.contatos-a.contatos;});var hc='';ts.forEach(function(t){var w=Math.max(3,Math.round(t.contatos/mx*100));var hot=(t.canal==="whatsapp"||t.canal==="ligacao")?" hot":"";hc+='<div class="bar"><span class="bn">'+esc(canalNome(t.canal))+'</span><span class="bb"><span class="bf'+hot+'" style="width:'+w+'%"></span></span><span class="bv">'+fmtInt(t.contatos)+'</span></div>'+(t.obs?'<div class="src" style="margin:-2px 0 6px 74px">'+esc(t.obs)+'</div>':'');});h+='<div class="panel"><div class="ph">Toques por canal · 30 dias</div><div class="pb">'+hc+'</div></div>';}
  // funil (etapas abertas)
  var abertos=(c.funil||[]).filter(function(f){return f.status==="open";}).sort(function(a,b){return b.n-a.n;});
  if(abertos.length){var mx2=Math.max.apply(null,abertos.map(function(f){return f.n;}));var hf='';abertos.slice(0,10).forEach(function(f){var w=Math.max(3,Math.round(f.n/mx2*100));hf+='<div class="bar" style="grid-template-columns:1fr 70px 34px"><span class="bn" style="font-size:11.5px">'+esc(((f.pipeline||"")+" / "+(f.etapa||"")).slice(0,34))+'</span><span class="bb"><span class="bf" style="width:'+w+'%"></span></span><span class="bv">'+f.n+'</span></div>';});h+='<div class="panel"><div class="ph">Pipeline aberto · por etapa</div><div class="pb">'+hf+'</div></div>';}
  // coorte
  if((c.coorte||[]).length){var co=c.coorte.slice().sort(function(a,b){return a.mes<b.mes?1:-1;});var ht='<table class="tbl"><tr><th>mês</th><th>entraram</th><th>ganho</th><th>perdido</th></tr>';co.slice(0,6).forEach(function(x){ht+='<tr><td>'+x.mes+'</td><td>'+x.entraram+'</td><td>'+x.won+'</td><td>'+x.lost+'</td></tr>';});ht+='</table>';h+='<div class="panel"><div class="ph">Coorte · entrada → resultado</div><div class="pb">'+ht+'</div></div>';}
  if(!resumo&&!toques.length&&!abertos.length)h+='<div class="panel"><div class="pb"><p class="vazio" style="margin:0">Sem métricas sincronizadas ainda. O sync do Pipedrive popula este painel.</p></div></div>';
  h+='</div><div class="dcol">';
  // contexto: perfil + estratégia
  var perfil=dsec(c,"perfil"),estr=dsec(c,"estrategia");
  if(perfil||estr){h+=secPanel(perfil)+secPanel(estr);}
  else h+='<div class="panel"><div class="pb"><p class="sub" style="margin:0 0 12px">Monte o dossiê para ver perfil, ICP e a direção estratégica aqui.</p>'+dossieBtn(p,"Construir dossiê (Opus)")+'</div></div>';
  h+='</div></div>';
  return h;
}

/* TELA: Conversa */
function renderConversa(p,c){
  var h=scrHead(p,"Conversa com o consultor","Ele conhece os números e as regras deste projeto. Pergunte, discuta estratégia ou ensine uma regra.");
  h+='<div class="convwrap"><section class="chat"><div id="chatmsgs" class="chatmsgs"></div><div class="chatinput"><textarea id="chatin" placeholder="Fale com o consultor do '+esc(p.nome)+'…" onkeydown="if(event.key===\'Enter\'&&(event.ctrlKey||event.metaKey))enviar();"></textarea><button class="btn" id="enviarbtn" onclick="enviar()">Enviar</button></div></section></div>';
  return h;
}

/* TELA: Playbook (conhecimento) */
function renderPlaybook(p,c){
  var pb=dsec(c,"playbook"),rg=dsec(c,"regras"),hi=dsec(c,"historico");
  var h=scrHead(p,"Playbook","Como se vende aqui: o que funciona, as regras do negócio e o histórico — mais as regras que você ensina ao consultor.",dossieBtn(p,(c.dossie||[]).length?"Atualizar dossiê (Opus)":"Construir dossiê (Opus)"));
  h+='<div class="stack">';
  if(pb)h+=secPanel(pb);else h+=dossieVazio(p,"O playbook de canais e táticas");
  if(rg)h+=secPanel(rg);
  if(hi)h+=secPanel(hi);
  // regras editáveis do projeto
  h+='<div class="panel"><div class="ph">Regras que você ensina · respeitadas por todos os agentes</div><div class="pb">'+tabRegras(p,c)+'</div></div>';
  h+='</div>';
  return h;
}

/* TELA: Abordagem (assistente) */
function renderAbordagem(p,c){
  var h=scrHead(p,"Assistente de abordagem","Gere materiais prontos para a próxima reunião ou abordagem — o consultor monta com base em tudo do cliente.");
  h+='<div class="gengrid">';
  h+='<div class="gencard"><span class="tag">Opus · sob demanda</span><h3>War Room</h3><p>Prepara a reunião de War Room: prioridades da semana, contas quentes, riscos e o que levar.</p><button class="btn" data-fn="war-room" data-slug="'+esc(p.slug)+'" onclick="gerarDoc(this)">Gerar War Room</button></div>';
  h+='<div class="gencard"><span class="tag">Opus · sob demanda</span><h3>Kit de Abordagem</h3><p>Monta abordagens por canal e perfil: ângulos, mensagens e perguntas de qualificação para prospectar.</p><button class="btn" style="background:transparent;border:1px solid var(--accent);color:var(--accent)" data-fn="agente-abordagens" data-slug="'+esc(p.slug)+'" onclick="gerarDoc(this)">Gerar Kit de Abordagem</button></div>';
  h+='</div>';
  h+='<div class="panel"><div class="ph">Materiais gerados</div><div class="pb">'+tabDocs(p,c)+'</div></div>';
  return h;
}

/* TELA: Demandas */
function renderDemandas(p,c){
  var acN=DADOS.acoes.filter(function(a){return a.projeto_id===p.id;}).length;
  var pr=dsec(c,"proxima_reuniao"),pa=dsec(c,"proximas_acoes");
  var h=scrHead(p,"Demandas","O que pede ação agora: pauta da próxima reunião, ações propostas e avisos.");
  h+='<div class="stack">';
  if(pr)h+=secPanel(pr,true);
  if(pa)h+=secPanel(pa);
  h+='<div class="panel"><div class="ph">Ações'+(acN?" · "+acN:"")+'</div><div class="pb">'+tabAcoes(p)+'</div></div>';
  h+='<div class="panel"><div class="ph">Avisos</div><div class="pb">'+tabAvisos(p)+'</div></div>';
  h+='</div>';
  return h;
}
function acc(id,titulo,conteudo,aberto){return '<div class="accsec"><div class="acch" data-acc="'+id+'" onclick="toggleAcc(this)">'+esc(titulo)+'<span class="accx">'+(aberto?"−":"+")+'</span></div><div class="accbody" id="acc-'+id+'" style="display:'+(aberto?"block":"none")+'">'+conteudo+'</div></div>';}
function toggleAcc(hd){var b=el("acc-"+hd.dataset.acc);var open=b.style.display!=="none";b.style.display=open?"none":"block";hd.querySelector(".accx").textContent=open?"+":"−";}

/* chat */
function renderChat(){var c=CACHE[ESTADO.pid]||{};var msgs=c.conversa||[];var box=el("chatmsgs");if(!box)return;
  if(!msgs.length){box.innerHTML='<div class="chatempty">Converse com o consultor do '+esc(proj().nome)+'. Ele conhece os números e as regras deste projeto. Pergunte, discuta estratégia, diga por que uma ação não vale, ou ensine uma regra de negócio.</div>';}
  else{var h='';msgs.forEach(function(m){h+='<div class="msg '+(m.papel==="assistant"?"ia":"eu")+'">'+(m.papel==="assistant"?mdRender(m.conteudo):esc(m.conteudo))+'</div>';});box.innerHTML=h;}
  box.scrollTop=box.scrollHeight;}
async function enviar(){var inp=el("chatin");var txt=inp.value.trim();if(!txt)return;
  var pid=ESTADO.pid,c=CACHE[pid]||(CACHE[pid]={});if(!c.conversa)c.conversa=[];
  c.conversa.push({papel:"user",conteudo:txt});inp.value="";renderChat();
  var btn=el("enviarbtn");btn.disabled=true;btn.textContent="…";
  var slug=proj().slug;
  try{var r=await sb.functions.invoke("conversa-consultor",{body:{projeto:slug,mensagem:txt}});
    var err=(r.data&&r.data.error)||(r.error&&r.error.message);
    c.conversa.push({papel:"assistant",conteudo:(err||!r.data||!r.data.resposta)?("(erro: "+(err||"não respondeu")+")"):r.data.resposta});
  }catch(e){c.conversa.push({papel:"assistant",conteudo:"(falha: "+String(e&&e.message||e)+")"});}
  btn.disabled=false;btn.textContent="Enviar";renderChat();}

/* dossiê do consultor */
async function reconstruirDossie(btn){var slug=btn.dataset.slug,t0=btn.textContent;btn.disabled=true;btn.textContent="Lendo reuniões (~1min)…";
  try{var r=await sb.functions.invoke("manter-dossie",{body:{projeto:slug}});var err=(r.data&&r.data.error)||(r.error&&r.error.message);
    if(err){alert("Não consegui: "+err);}else{delete CACHE[ESTADO.pid];await carregarProjeto(ESTADO.pid);render();return;}
  }catch(e){alert("Falha: "+String(e&&e.message||e));}
  btn.disabled=false;btn.textContent=t0;}

/* trilho: ações / regras / docs / dados / avisos */
function tabAcoes(p){var props=DADOS.acoes.filter(function(a){return a.projeto_id===p.id;});
  if(!props.length)return '<p class="vazio">Nenhuma ação pendente. O Agente Consultor roda todo dia e propõe novas.</p>';
  props.sort(function(a,b){return (a.status==="aprovada"?1:0)-(b.status==="aprovada"?1:0);});var h='<div class="acoes">';
  props.forEach(function(a){h+='<div class="acao'+(a.status==="aprovada"?" aprovada":"")+'"><div class="acao-h"><span class="acao-t">'+esc(a.titulo)+'</span><span class="acao-pj">'+(a.status==="aprovada"?"ok · ":"")+esc(a.origem)+'</span></div>';if(a.detalhe)h+='<div class="acao-d">'+esc(a.detalhe)+'</div>';h+='<div class="acao-btns">';if(a.status==="proposta")h+='<button class="ab ap" data-id="'+a.id+'" data-st="aprovada" onclick="decidir(this)">Aprovar</button>';h+='<button class="ab" data-id="'+a.id+'" data-st="feita" onclick="decidir(this)">Feito</button><button class="ab" data-id="'+a.id+'" data-st="descartada" onclick="decidir(this)">Descartar</button></div></div>';});
  return h+'</div>';}
async function decidir(btn){var id=btn.dataset.id,st=btn.dataset.st;var w=btn.parentNode;w.innerHTML='<span class="src">salvando...</span>';var r=await sb.from("acoes").update({status:st,decidido_em:new Date().toISOString(),decidido_por:window.UID}).eq("id",id);if(r.error){w.innerHTML='<span class="src">erro</span>';return;}if(st==="aprovada"){var a=DADOS.acoes.filter(function(x){return x.id===id;})[0];if(a)a.status="aprovada";}else{DADOS.acoes=DADOS.acoes.filter(function(x){return x.id!==id;});}render();}
function tabRegras(p,c){var h='<p class="src" style="margin:0 0 10px">O que todos os agentes respeitam. Ensine o que o dado não diz.</p>';
  (c.regras||[]).forEach(function(r){h+='<div class="regra">'+esc(r.regra)+'<span class="del" data-id="'+r.id+'" onclick="delRegra(this)">✕</span></div>';});
  if(!(c.regras||[]).length)h+='<p class="vazio">Nenhuma regra ainda.</p>';
  h+='<div class="regraform"><textarea id="novaregra" placeholder="Ex.: ganho = contrato assinado; cobrança é outro time."></textarea><button class="btn" style="margin-top:8px" data-pid="'+p.id+'" onclick="addRegra(this)">Adicionar regra</button></div>';return h;}
async function addRegra(btn){var txt=el("novaregra").value.trim();if(txt.length<4)return;btn.disabled=true;btn.textContent="Salvando...";var r=await sb.from("regras_projeto").insert({projeto_id:btn.dataset.pid,regra:txt,criado_por:window.UID});if(r.error){btn.disabled=false;btn.textContent="Adicionar regra";alert("Erro: "+r.error.message);return;}delete CACHE[btn.dataset.pid];await carregarProjeto(btn.dataset.pid);render();}
async function delRegra(span){if(!confirm("Remover esta regra?"))return;var r=await sb.from("regras_projeto").delete().eq("id",span.dataset.id);if(r.error){alert("Erro: "+r.error.message);return;}delete CACHE[ESTADO.pid];await carregarProjeto(ESTADO.pid);render();}
function tabDocs(p,c){var h='';if((c.docs||[]).length){h+='<div class="doclist">';c.docs.forEach(function(d){h+='<span class="doclink" data-id="'+d.id+'" onclick="verDoc(this)">'+esc(d.titulo)+'</span>';});h+='</div>';}else h+='<p class="vazio">Nenhum documento ainda. Use os botões acima.</p>';return h;}
function tabAvisos(p){return buildAvisos(DADOS.recsOpen.filter(function(r){return r.projeto_id===p.id;}),DADOS.sinaisA.filter(function(s){return s.projeto_id===p.id;}),DADOS.metricas.filter(function(m){return m.projeto_id===p.id;}),(DADOS.alertaGanho||[]).filter(function(g){return g.projeto_id===p.id;}),[p],false);}
function tabResumo(p,c){
  var mP=DADOS.metricas.filter(function(m){return m.projeto_id===p.id;});
  var toques=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("toques")===0&&m.contatos!=null;}),resumo=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("neg")===0;})[0],reun=mP.filter(function(m){return m.periodo&&m.periodo.indexOf("reuni")===0;})[0];
  var h='';
  if(toques.length){var max=Math.max.apply(null,toques.map(function(t){return t.contatos;}));toques.sort(function(a,b){return b.contatos-a.contatos;});h+='<div class="barswrap"><div class="barslbl">TOQUES · 30D</div>';toques.forEach(function(t){var w=Math.max(3,Math.round(t.contatos/max*100));var hot=(t.canal==="whatsapp"||t.canal==="ligacao")?" hot":"";h+='<div class="bar"><span class="bn">'+esc(canalNome(t.canal))+'</span><span class="bb"><span class="bf'+hot+'" style="width:'+w+'%"></span></span><span class="bv">'+fmtInt(t.contatos)+'</span></div>';});h+='</div>';}
  if(resumo){h+='<div class="funnel"><div class="step"><div class="v">'+fmtInt(resumo.contatos)+'</div><div class="k">neg.</div></div><div class="step hi"><div class="v">'+fmtInt(resumo.fechamentos)+'</div><div class="k">ganhos</div></div><div class="step hi"><div class="v">'+fmtMoney(resumo.valor_fechado)+'</div><div class="k">ganho</div></div></div>';if(resumo.obs)h+='<div class="src">'+esc(resumo.obs)+'</div>';}
  if(reun)h+='<div class="src">reuniões: '+fmtInt(reun.reunioes)+(reun.obs?' · '+esc(reun.obs):'')+'</div>';
  if(!toques.length&&!resumo)h+='<div class="nofunnel">Sem métrica ainda.</div>';
  var abertos=(c.funil||[]).filter(function(f){return f.status==="open";}).sort(function(a,b){return b.n-a.n;});
  if(abertos.length){var mx=Math.max.apply(null,abertos.map(function(f){return f.n;}));h+='<div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;letter-spacing:.1em;color:var(--t2);margin:14px 0 6px">FUNIL POR ETAPA · ABERTOS</div>';abertos.slice(0,10).forEach(function(f){var w=Math.max(3,Math.round(f.n/mx*100));h+='<div class="bar" style="grid-template-columns:1fr 60px 30px"><span class="bn" style="font-size:11px">'+esc(((f.pipeline||"")+"/"+(f.etapa||"")).slice(0,28))+'</span><span class="bb"><span class="bf" style="width:'+w+'%"></span></span><span class="bv">'+f.n+'</span></div>';});}
  if((c.coorte||[]).length){h+='<div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;letter-spacing:.1em;color:var(--t2);margin:14px 0 6px">COORTE · ENTRADA→RESULTADO</div>';var co=c.coorte.slice().sort(function(a,b){return a.mes<b.mes?1:-1;});h+='<table class="tbl"><tr><th>mês</th><th>ent.</th><th>ganho</th><th>perd.</th></tr>';co.slice(0,6).forEach(function(x){h+='<tr><td>'+x.mes+'</td><td>'+x.entraram+'</td><td>'+x.won+'</td><td>'+x.lost+'</td></tr>';});h+='</table>';}
  return h||'<p class="vazio">Sem dados.</p>';
}

/* documentos (overlay) */
function fecharDoc(){el("docov").style.display="none";}
function mostrarDoc(md){el("docovbody").innerHTML=mdRender(md);el("docov").style.display="flex";el("docov").scrollTop=0;}
async function gerarDoc(btn){var slug=btn.dataset.slug,fn=btn.dataset.fn,t0=btn.textContent;btn.disabled=true;btn.textContent="Gerando (~30s)…";try{var r=await sb.functions.invoke(fn,{body:{projeto:slug}});var err=(r.data&&r.data.error)||(r.error&&r.error.message);if(err||!r.data||!r.data.documento){alert("Não consegui gerar: "+(err||"erro"));}else{mostrarDoc(r.data.documento.conteudo);delete CACHE[ESTADO.pid];await carregarProjeto(ESTADO.pid);render();}}catch(e){alert("Falha: "+String(e&&e.message||e));}btn.disabled=false;btn.textContent=t0;}
async function verDoc(span){var r=await sb.from("documentos").select("conteudo").eq("id",span.dataset.id).single();if(r.error){alert("Erro: "+r.error.message);return;}mostrarDoc(r.data.conteudo);}

sb.auth.onAuthStateChange(function(e){if(e==="SIGNED_IN")boot();});
boot();
</script>
